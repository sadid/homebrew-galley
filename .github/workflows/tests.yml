name: CI

# Validates the cask on every push / PR (including the automated version bumps)
# with `brew style` and `brew audit`, so a bad bump shows up as a red check.
#
# Note: we deliberately do NOT use Homebrew/actions/setup-homebrew here. That
# action auto-detects this repo as a tap and tries to `git fetch` it from the
# remote — which fails on a PRIVATE tap repo ("could not read Username").
# GitHub's macOS runners already ship Homebrew, so we just drop the checkout
# into Library/Taps and run the checks against it locally (no network fetch of
# this repo needed).

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_ANALYTICS: "1"
  HOMEBREW_NO_ENV_HINTS: "1"
  HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
  # Authenticated GitHub API calls (livecheck / online audit) avoid anon rate limits.
  HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  test:
    runs-on: macos-latest
    steps:
      - name: Check out tap
        uses: actions/checkout@v4
        with:
          path: checkout

      - name: Install checkout as a local tap
        run: |
          dest="$(brew --repository)/Library/Taps/sadid/homebrew-galley"
          mkdir -p "$(dirname "$dest")"
          cp -R "$GITHUB_WORKSPACE/checkout" "$dest"
          brew tap-info sadid/galley

      - name: brew style
        run: brew style sadid/galley/galley

      - name: brew audit
        run: brew audit --cask --online sadid/galley/galley
