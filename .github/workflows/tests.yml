name: CI

# Validates the cask on every push / PR (including the automated version bumps)
# with `brew style` and `brew audit`, so a bad bump shows up as a red check.

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

env:
  HOMEBREW_NO_INSTALL_FROM_API: 1
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_REQUIRE_TAP_TRUST: 1

jobs:
  test:
    runs-on: macos-latest
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@master

      - name: Check out tap
        uses: actions/checkout@v4
        with:
          path: checkout

      # Install the checkout as a real tap (a git dir under Library/Taps) so the
      # cask loader — and the Cask/* RuboCop cops — can resolve sadid/galley/galley.
      - name: Install checkout as a tap
        run: |
          dest="$(brew --repository)/Library/Taps/sadid/homebrew-galley"
          mkdir -p "$(dirname "$dest")"
          cp -R "$GITHUB_WORKSPACE/checkout" "$dest"
          brew tap-info sadid/galley

      - name: brew style
        run: brew style sadid/galley/galley

      - name: brew audit
        run: brew audit --cask --online sadid/galley/galley
